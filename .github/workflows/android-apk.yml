
name: Build Shearing France Android

on:
  push:
    branches: [main, principal]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed Android APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare current web app
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp manifest.webmanifest www/manifest.webmanifest
          cp sw.js www/sw.js
          cp atm-logo.png www/atm-logo.png
          cp shearing-logo.svg www/shearing-logo.svg
          cp moutons-prairie.png www/moutons-prairie.png

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Synchronize application
        run: npx cap sync android

      - name: Decode release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/shearing-france-release.jks
          test -s android/app/shearing-france-release.jks

      - name: Verify release keystore
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          keytool -list \
            -keystore android/app/shearing-france-release.jks \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASSWORD"

      - name: Configure Android release signing
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat >> app/build.gradle <<'GRADLE'

          // Shearing France release signing
          android {
              signingConfigs {
                  release {
                      storeFile file("shearing-france-release.jks")
                      storePassword System.getenv("STORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("STORE_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE

          grep -n "signingConfig signingConfigs.release" app/build.gradle

      - name: Build signed AAB
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Verify AAB signature
        run: |
          jarsigner -verify -certs \
            android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Shearing-France-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90

      - name: Build signed APK
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER=$(find "$SDK/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Shearing-France-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
          
