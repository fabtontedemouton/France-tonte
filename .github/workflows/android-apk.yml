
name: Build Shearing France APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check project files
        run: |
          test -f package.json
          test -f index.html
          test -f capacitor.config.json

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/
          cp sw.js www/
          cp shearing-logo.svg www/
          cp manifest.webmanifest www/
          cp moutons-prairie.png www/
          cp VERSION.txt www/

      - name: Generate Android project
        run: npx cap add android

      - name: Synchronize Android project
        run: npx cap sync android

      - name: Compile APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Shearing-France-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          
