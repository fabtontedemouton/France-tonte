
name: Build Shearing France Android

on:
  push:
    branches: [principal, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed Android APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare current web app
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp manifest.webmanifest www/manifest.webmanifest
          cp sw.js www/sw.js
          cp atm-logo.png www/atm-logo.png
          cp shearing-logo.svg www/shearing-logo.svg
          cp moutons-prairie.png www/moutons-prairie.png

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Synchronize application
        run: npx cap sync android

      - name: Decode release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/shearing-france-release.jks
          test -s android/app/shearing-france-release.jks

      - name: Configure Android release signing
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle")
          s = p.read_text()

          signing = """
              signingConfigs {
                  release {
                      storeFile file("shearing-france-release.jks")
                      storePassword System.getenv("STORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("STORE_PASSWORD")
                  }
              }
          """

          if "signingConfigs" not in s:
              if "buildTypes {" not in s:
                  raise SystemExit("Bloc buildTypes introuvable")
              s = s.replace("buildTypes {", signing + "\n    buildTypes {", 1)

          pattern = r"(buildTypes\s*\{\s*release\s*\{)"
          s, count = re.sub(
              pattern,
              r"\1\n            signingConfig signingConfigs.release",
              s,
              count=1
          )

          if count != 1:
              raise SystemExit("Configuration release introuvable")

          p.write_text(s)
          PY

      - name: Build signed AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Verify AAB signature
        run: |
          jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Shearing-France-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90

      - name: Build signed APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Shearing-France-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
          
